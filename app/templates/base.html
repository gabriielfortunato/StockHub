<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Stokfy{% endblock %}</title>
    <link rel="icon" type="image/jpeg" href="/static/img/favicon_stokfy.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    <script>
    (() => {
        const token = sessionStorage.getItem("stockhub_token");
        if (!token) return;
        const registrarAtividade = () => {
            fetch("/auth/atividade", {
                method: "POST",
                headers: { Authorization: `Bearer ${token}` }
            }).catch(() => {});
        };
        registrarAtividade();
        window.setInterval(registrarAtividade, 60000);
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) registrarAtividade();
        });
    })();
    </script>
</body>
</html>
