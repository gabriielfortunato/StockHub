{% extends "base.html" %}
{% block title %}Acesso de funcionário · Stokfy{% endblock %}
{% block content %}
<div class="auth-screen">
  <aside class="auth-brand"><div class="auth-brand__inner"><p class="auth-brand__logo">Stokfy</p><h1 class="auth-brand__headline">Acesso da<br>sua equipe.</h1><p class="auth-brand__sub">Entre com as credenciais fornecidas pelo responsável da loja.</p></div></aside>
  <main class="auth-form-panel"><form class="auth-form" id="func-login"><p class="auth-form__eyebrow">Área da equipe</p><h2 class="auth-form__title">Entrar como funcionário</h2>
  <label class="field"><span class="field__label">E-mail</span><input id="func-email" type="email" autocomplete="username" required></label>
  <label class="field"><span class="field__label">Senha</span><input id="func-senha" type="password" autocomplete="current-password" required></label>
  <p id="func-erro" class="form-error" hidden></p><button class="btn-primary" type="submit">Entrar</button>
  <p class="auth-form__footer"><a href="/login">Voltar ao login principal</a></p></form></main>
</div>
<script>
document.getElementById("func-login").addEventListener("submit",async e=>{
 e.preventDefault();const erro=document.getElementById("func-erro");erro.hidden=true;
 try{const r=await fetch("/equipe/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("func-email").value,senha:document.getElementById("func-senha").value})});
 const d=await r.json();if(!r.ok)throw new Error(d.detail||"Não foi possível entrar.");sessionStorage.setItem("stockhub_token",d.access_token);location.href="/painel";
 }catch(err){erro.textContent=err.message;erro.hidden=false;}
});
</script>
{% endblock %}
