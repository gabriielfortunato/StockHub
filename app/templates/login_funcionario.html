{% extends "base.html" %}{% block title %}Acesso de funcionário · Stokfy{% endblock %}{% block head %}<link rel="stylesheet" href="/static/css/auth.css">{% endblock %}{% block content %}<main class="auth-shell"><section class="auth-card"><p class="auth-eyebrow">STOKFY</p><h1>Acesso de funcionário</h1><p>Entre com o e-mail e a senha fornecidos pelo responsável da loja.</p><form id="func-login"><label class="field"><span class="field__label">E-mail</span><input id="func-email" type="email" required></label><label class="field"><span class="field__label">Senha</span><input id="func-senha" type="password" required></label><p id="func-erro" class="form-error" hidden></p><button class="btn-primary" type="submit">Entrar</button></form><a href="/login">Voltar ao login principal</a></section></main><script>document.getElementById("func-login").addEventListener("submit",async e=>{e.preventDefault();const erro=document.getElementById("func-erro");erro.hidden=true;try{const r=await fetch("/equipe/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("func-email").value,senha:document.getElementById("func-senha").value})});const d=await r.json();if(!r.ok)throw new Error(d.detail||"Não foi possível entrar.");sessionStorage.setItem("stockhub_token",d.access_token);location.href="/painel";}catch(err){erro.textContent=err.message;erro.hidden=false;}});</script>{% endblock %}
