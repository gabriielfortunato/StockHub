<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Stokfy</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .header-painel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #F8FAFC;
            border-bottom: 1px solid #E2E8F0;
        }
        .badge-plus-header {
            background-color: #10B981;
            color: #FFFFFF;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .btn-upgrade-header {
            background-color: #2563EB;
            color: #FFFFFF;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header class="header-painel">
        <h2>Stokfy - Painel de Controle</h2>
        <div id="status-plano-header">
            <a href="/assinatura" id="btn-header-upgrade" class="btn-upgrade-header">Fazer Upgrade</a>
        </div>
    </header>

    <main style="padding: 30px;">
        <h3>Bem-vindo ao seu sistema de estoque!</h3>
        <p>Gerencie seus produtos, categorias e movimentações.</p>
    </main>

    <script>
        async function verificarPlanoHeader() {
            try {
                const response = await fetch('/auth/me');
                if (response.ok) {
                    const loja = await response.json();
                    const container = document.getElementById('status-plano-header');

                    if (loja.plano === 'plus') {
                        container.innerHTML = '<span class="badge-plus-header">★ Plano Plus</span>';
                    }
                }
            } catch (error) {
                console.error("Erro ao verificar plano no painel:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', verificarPlanoHeader);
    </script>
</body>
</html>
